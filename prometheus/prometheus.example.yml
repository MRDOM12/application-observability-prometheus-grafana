global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/prometheus/alert_rules.yml"

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - '172.31.3.153:9100'
          - '172.31.12.23:9100'
          - '172.31.5.63:9100'
        labels:
          environment: 'production'

  - job_name: 'web-app'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'web-app:8080'
