groups:
  - name: application-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code="500"}[1m]))
          /
          sum(rate(http_requests_total[1m])) * 100 > 5
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate detected"
          description: "HTTP 500 error rate has exceeded 5%."

      - alert: HighCpuUsage
        expr: |
          100 - avg by (instance) (
            rate(node_cpu_seconds_total{mode="idle"}[1m])
          ) * 100 > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage has exceeded 80%."
